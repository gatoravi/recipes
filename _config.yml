# Site settings
title: Recipes
description: A family recipe collection — South Indian home cooking from my mom's kitchen.
author: Avinash Ramu

# Published at https://gatoravi.github.io/recipes
url: "https://gatoravi.github.io"
baseurl: "/recipes"

# Build settings
permalink: /:categories/:title/
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-sitemap

# Every post is a recipe
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - Gruntfile.js
  - node_modules
  - vendor
  - README.md
  - LICENSE
  - theme-setup
  - "*.sublime-project"
  - "*.sublime-workspace"
