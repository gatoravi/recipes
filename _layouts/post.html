---
layout: default
---
<article class="recipe">
  <p class="back-link"><a href="{{ '/' | relative_url }}">&larr; All recipes</a></p>
  <h1 class="recipe-title">{{ page.title }}</h1>
  <p class="recipe-meta">
    {% if page.source %}<span class="source">{{ page.source }}</span>{% endif %}
    {% if page.tags and page.tags != empty %}{% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}{% endif %}
  </p>
  {% if page.scan_note %}
  <p class="scan-note">{{ page.scan_note }}</p>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
  <p class="back-link bottom"><a href="{{ '/' | relative_url }}">&larr; All recipes</a></p>
</article>
